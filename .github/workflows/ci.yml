name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync dependencies
        run: uv sync --extra crosssim --extra aihwkit
      - name: Lint
        run: uv run ruff check src experiments tests
      - name: Format check
        run: uv run ruff format --check src experiments tests
      - name: Unit + integration tests
        run: uv run pytest tests/ -v
